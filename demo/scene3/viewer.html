          --distract:#2f6fc8; --ok:#1e7a4c; --route:#8a6d3b; }

  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  td { padding:4px 0; vertical-align:top; }

<script>
const DATA = {"scene": {"formatVersion": "safesitegen/scene-1.0", "scenarioId": "scn_steel_frame_level3_00008", "site": {"id": "steel_frame_level3", "name": "Steel frame building, level 3 deck", "provenance": "synthetic_substrate", "width": 24, "depth": 16, "grade_elevation_ft": 0.0, "deck_elevation_ft": 30.0, "zones": [{"name": "north_edge", "type": "slab_edge", "x": 0, "y": 0, "w": 24, "d": 2}, {"name": "main_deck", "type": "deck", "x": 0, "y": 2, "w": 24, "d": 11}, {"name": "access_bay", "type": "access", "x": 0, "y": 13, "w": 6, "d": 3}, {"name": "laydown", "type": "laydown", "x": 6, "y": 13, "w": 12, "d": 3}, {"name": "south_scaffold", "type": "scaffold_bay", "x": 18, "y": 13, "w": 6, "d": 3}], "obstacles": [{"x": 8, "y": 6, "w": 1, "d": 1, "asset_type": "steel_column"}, {"x": 16, "y": 6, "w": 1, "d": 1, "asset_type": "steel_column"}, {"x": 12, "y": 9, "w": 2, "d": 1, "asset_type": "stacked_decking"}], "entry": [2, 14], "patrol": [{"x": 2, "y": 14}, {"x": 6, "y": 12}, {"x": 11, "y": 9}, {"x": 16, "y": 7}, {"x": 20, "y": 4}, {"x": 12, "y": 2}, {"x": 4, "y": 3}, {"x": 19, "y": 12}]}, "trade": "ironworker", "activity": "steel decking and connection", "difficulty": 0.353, "validated": true, "instances": [{"instanceId": "e1_fall_unprotected_edge", "prefab": "Prefabs/Generic/Placeholder", "assetType": "ironworker", "kind": "worker", "transform": {"position": [22.0, 0.0, 0.0], "rotationY": 0.0}, "zone": "north_edge", "isDistractor": false, "params": {"fall_height_ft": 13.4, "context": "edge_exposure"}, "controls": [], "scoring": {"hazardId": "h1", "hazardClass": "fall_unprotected_edge", "clause": "1926.501(b)(1)", "severity": "fatal", "requiredControls": ["guardrail_system", "safety_net", "personal_fall_arrest"], "cueSalience": 0.55}}, {"instanceId": "e2_ctx", "prefab": "Prefabs/Structure/DeckEdge", "assetType": "deck_edge", "kind": "structure", "transform": {"position": [20.0, 0.0, 11.0], "rotationY": 0.0}, "zone": "main_deck", "isDistractor": false, "params": {}, "c ort": {"scenario_id": "scn_steel_frame_level3_00008", "passed": true, "difficulty": 0.353, "metrics": {"n_entities": 7, "n_hazards": 2, "n_distractors": 3, "hazard_classes": ["fall_floor_opening", "fall_unprotected_edge"], "signature": "631393b05f8fd4e2"}, "checks": [{"check_id": "SCH.wellformed", "layer": "schema", "status": "pass", "detail": "scenario graph is well formed", "clause": null, "entity": null}, {"check_id": "REG.hazard_realised", "layer": "regulatory", "status": "pass", "detail": "fall_unprotected_edge is present on e1_fall_unprotected_edge as declared", "clause": "1926.501(b)(1)", "entity": "e1_fall_unprotected_edge"}, {"check_id": "REG.hazard_realised", "layer": "regulatory", "status": "pass", "detail": "fall_floor_opening is present on e3_fall_floor_opening as declared", "clause": "1926.501(b)(4)(i)", "entity": "e3_fall_floor_opening"}, {"check_id": "REG.no_unintended_violation", "layer": "regulatory", "status": "pass", "detail": "no unlabelled regulatory violations in the scene", "clause": null, "entity": null}, {"check_id": "PHY.placed", "layer": "physical", "status": "pass", "detail": "satisfied for all entities", "clause": null, "entity": null}, {"check_id": "PHY.in_bounds", "layer": "physical", "status": "pass", "detail": "satisfied for all entities", "clause": null, "entity": null}, {"check_id": "PHY.no_overlap", "layer": "physical", "status": "pass", "detail": "satisfied for all entities", "clause": null, "entity": null}, {"check_id": "PHY.supported", "layer": "physical", "status": "pass", "detail": "satisfied for all entities", "clause": null, "entity": null}, {"check_id": "PHY.reachable", "layer": "physical", "status": "pass", "detail": "satisfied for all entities", "clause": null, "entity": null}, {"check_id": "PHY.no_interpenetration", "layer": "physical", "status": "pass", "detail": "satisfied for all entities", "clause": null, "entity": null}, {"check_id": "PHY.zone_affordance", "layer": "physical", "status": "pass", "detail": "satisfied for all entities", "clause": null, "entity": null}, {"check_id": "PED.hazard_count", "layer": "pedagogical", "status": "pass", "detail": "2 teaching points", "clause": null, "entity": null}, {"check_id": "PED.cue_perceivable", "layer": "pedagogical", "status": "pass", "detail": "every teaching point is visible from the trainee route", "clause": null, "entity": null}, {"check_id": "PED.distractor_present", "layer": "pedagogical", "status": "pass", "detail": "3 distractors", "clause": null, "entity": null}, {"check_id": "PED.hazard_separation", "layer": "pedagogical", "status": "pass", "detail": "teaching points are spatially separated", "clause": null, "entity": null}, {"check_id": "PED.curriculum_coverage", "layer": "pedagogical", "status": "pass", "detail": "all requested hazard classes delivered", "clause": null, "entity": null}, {"check_id": "PED.difficulty_band", "layer": "pedagogical", "status": "pass", "detail": "difficulty 0.35 within band of 0.35", "clause": null, "entity": null}]}};

const ZONE_FILL = {
  slab_edge:"#fdf0e6", deck:"#f2f5f8", access:"#eef4ee", laydown:"#f7f4ec",
  excavation:"#efeae2", work_zone:"#eef1f7", haul_road:"#eceff2"
};

function draw() {
  const cv = document.getElementById("c"), g = cv.getContext("2d");
  const site = DATA.scene.site;
  const pad = 40;
  const s = Math.min((cv.width - 2*pad) / site.width, (cv.height - 2*pad) / site.depth);
  const X = x => pad + x * s, Y = y => pad + y * s;

  g.clearRect(0,0,cv.width,cv.height);
  g.fillStyle = "#fff"; g.fillRect(0,0,cv.width,cv.height);

  for (const z of site.zones) {
    g.fillStyle = ZONE_FILL[z.type] || "#f4f6f8";
    g.fillRect(X(z.x), Y(z.y), z.w*s, z.d*s);
    g.strokeStyle = "#e2e7ec"; g.lineWidth = 1;
    g.strokeRect(X(z.x), Y(z.y), z.w*s, z.d*s);
    g.fillStyle = "#98a3ae"; g.font = "10px Helvetica";
    g.fillText(z.type, X(z.x)+4, Y(z.y)+12);
  }

  g.strokeStyle = "#eef1f4"; g.lineWidth = 0.5;
  for (let x=0; x<=site.width; x++){ g.beginPath(); g.moveTo(X(x),Y(0)); g.lineTo(X(x),Y(site.depth)); g.stroke(); }
  for (let y=0; y<=site.depth; y++){ g.beginPath(); g.moveTo(X(0),Y(y)); g.lineTo(X(site.width),Y(y)); g.stroke(); }

  for (const o of site.obstacles) {
    g.fillStyle = "#c9ced6";
    g.fillRect(X(o.x), Y(o.y), o.w*s, o.d*s);
  }

  g.strokeStyle = "#8a6d3b"; g.lineWidth = 1.6; g.setLineDash([5,4]);
  g.beginPath();
  site.patrol.forEach((p,i) => i ? g.lineTo(X(p.x+0.5),Y(p.y+0.5)) : g.moveTo(X(p.x+0.5),Y(p.y+0.5)));
  g.stroke(); g.setLineDash([]);
  site.patrol.forEach(p => {
    g.fillStyle = "#8a6d3b"; g.beginPath();
    g.arc(X(p.x+0.5), Y(p.y+0.5), 3, 0, 6.284); g.fill();
  });

  const keyed = {};
  DATA.scene.answerKey.forEach((a,i) => keyed[a.entityId] = i+1);

  for (const inst of DATA.scene.instances) {
    const px = X(inst.transform.position[0] + 0.5), py = Y(inst.transform.position[2] + 0.5);
    const isHaz = inst.scoring !== null;
    g.fillStyle = isHaz ? "#c8322f" : (inst.isDistractor ? "#2f6fc8" : "#94a3b2");
    g.beginPath(); g.arc(px, py, isHaz ? 8 : 5.5, 0, 6.284); g.fill();
    if (isHaz) {
      g.strokeStyle = "rgba(200,50,47,.35)"; g.lineWidth = 1.4;
      g.beginPath(); g.arc(px, py, 15, 0, 6.284); g.stroke();
      g.fillStyle = "#fff"; g.font = "bold 10px Helvetica"; g.textAlign = "center";
      g.fillText(String(keyed[inst.instanceId] || ""), px, py+3.5);
      g.textAlign = "start";
    }
    g.fillStyle = "#5c6773"; g.font = "9.5px Helvetica";
    g.fillText(inst.assetType, px + 11, py + 3);
  }
}

function render() {
  const hz = document.getElementById("haz");
  hz.innerHTML = DATA.scene.answerKey.map((a,i) => {
    const inst = DATA.scene.instances.find(x => x.instanceId === a.entityId) || {};
    const req = (inst.scoring && inst.scoring.requiredControls || []).join(", ") || "n/a";
    return `<div class="chk"><span class="tag fail">${i+1}</span>
      <b>${a.hazardClass.replace(/_/g," ")}</b><br/>
      <table>
        <tr><td class="k">clause</td><td class="clause">${a.clause}</td></tr>
        <tr><td class="k">required control</td><td>${req}</td></tr>
        <tr><td class="k">present control</td><td>${(inst.controls||[]).join(", ") || "none"}</td></tr>
        <tr><td class="k">location</td><td>${inst.transform ?
          inst.transform.position[0]+", "+inst.transform.position[2] : "?"}</td></tr>
      </table></div>`;
  }).join("");

  document.getElementById("checks").innerHTML = DATA.report.checks.map(c =>
    `<div class="chk"><span class="tag ${c.status}">${c.status}</span>
     <span class="cid">${c.check_id}</span><br/>
     <span class="det">${c.detail}</span></div>`).join("");
}

draw(); render();
</script>
