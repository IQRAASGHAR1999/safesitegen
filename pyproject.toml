[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safesitegen"
version = "0.1.0"
description = "Verifiable procedural generation of construction safety training scenarios"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Iqra Asghar", email = "iqraasghar9692@gmail.com"}]
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]

[project.scripts]
safesitegen = "safesitegen.cli:main"

[tool.setuptools.packages.find]
include = ["safesitegen*"]

[tool.setuptools.package-data]
safesitegen = ["knowledge/*.json"]
